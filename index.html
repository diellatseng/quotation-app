    <!-- Google Fonts: Noto Sans TC for Chinese support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/quotation-app/assets/favicon-32x32-CuNpkdpm.png">
    <script type="module" crossorigin src="/quotation-app/assets/index-sICURng-.js"></script>
    <link rel="stylesheet" crossorigin href="/quotation-app/assets/index-BjrjKR0S.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages: restore deep link before the app bundle (see src/lib/spaRedirect.js).
      // Must match vite.config.js `base` (no trailing slash) and public/404.html `BASE`.
      (function () {
        try {
          var stored = sessionStorage.getItem('spaRedirect')
          if (!stored) return
          sessionStorage.removeItem('spaRedirect')
          var base = '/quotation-app'
          var path = stored.charAt(0) === '/' ? stored : '/' + stored
          var next = base + path
          if (location.pathname + location.search + location.hash !== next) {
            history.replaceState(null, '', next)
          }
        } catch (e) {}
      })()
    </script>
  </body>
</html>
