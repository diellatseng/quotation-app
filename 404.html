<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <title>案件管理系統</title>
    <script>
      // GitHub Pages SPA fallback — preserve deep links (e.g. /quotation-app/dashboard).
      // Must match vite.config.js `base` (no trailing slash) and index.html inline `base`.
      (function () {
        var BASE = '/quotation-app'
        var path = window.location.pathname
        var suffix = path.startsWith(BASE) ? path.slice(BASE.length) : path
        suffix = suffix.replace(/\/$/, '') || ''
        var target = suffix + window.location.search + window.location.hash
        if (target && target !== '/') {
          sessionStorage.setItem('spaRedirect', target)
        }
        window.location.replace(BASE + '/')
      })()
    </script>
  </head>
  <body></body>
</html>
